name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Syntax check
        run: python3 -m py_compile aws_sso_sync/*.py aws_sso_sync/i18n/*.py aws_sso_sync/i18n/catalog/*.py

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: i18n catalog parity check
        run: python3 scripts/check_i18n.py
